<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BMI Calculator </title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Story+Script&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="major">
        <h2> ------Welcome to the BMI Calculator-------</h2>
        <div class="input">
        <div class="weight">
            <span> Enter your Weight:- </span>
            <input id = "mass" type="number" placeholder="Enter your weight in CM"/>
        </div>

        <div class="height">
            <span> Enter your Height:- </span>
            <input id="tall" type="text" placeholder="Enter your height in CM"/>
        </div>
        </div>

        <button class="bttn"> Calculate </button>
    </div>
    

    <script src="app.js"> </script>
</body>
</html>
